# .github/workflows/deploy.yml
name: CD - Deploy to Databricks

on:
  push:
    branches: [main]

env:
  DATABRICKS_DEV_HOST: ${{ secrets.DATABRICKS_DEV_HOST }}
  DATABRICKS_DEV_TOKEN: ${{ secrets.DATABRICKS_DEV_TOKEN }}
  DATABRICKS_PROD_HOST: ${{ secrets.DATABRICKS_PROD_HOST }}
  DATABRICKS_PROD_TOKEN: ${{ secrets.DATABRICKS_PROD_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Databricks CLI
        run: pip install databricks-cli
      
      - name: Sync to Dev Workspace
        run: |
          databricks repos update \
            --repo-id /Repos/dev/taxi-mlops \
            --branch develop \
            --path /Repos/dev/taxi-mlops
      
      - name: Run Dev Tests
        run: |
          databricks workspace import_dir \
            --source-path tests/ \
            --target-path /Repos/dev/taxi-mlops/tests \
            --overwrite
      
      - name: Sync to Prod Workspace
        run: |
          databricks repos update \
            --repo-id /Repos/prod/taxi-mlops \
            --branch main \
            --path /Repos/prod/taxi-mlops
      
      - name: Trigger Prod Job
        run: |
          databricks jobs run-now \
            --job-id 123 \  # Your production training job
            --timeout-seconds 3600